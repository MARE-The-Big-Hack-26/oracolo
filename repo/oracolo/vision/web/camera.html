<!doctype html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oracolo – camera</title><style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,Helvetica,Arial,sans-serif}
video{width:100%;height:100%;object-fit:contain;background:#000}
#hud{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;gap:8px;flex-wrap:wrap;font-size:14px}
#hud span{background:rgba(0,0,0,.55);padding:4px 8px;border-radius:8px}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111;gap:16px;text-align:center;padding:24px}
button{font-size:20px;padding:14px 26px;border-radius:14px;border:0;background:#2563eb;color:#fff}
small{opacity:.8;max-width:340px}
</style></head><body>
<div id="start"><h2>Camera fissa Oracolo</h2>
<small>Appoggia l'iPhone sul treppiede, in orizzontale, fermo. Premi Avvia e consenti l'uso della camera.</small>
<button id="go">Avvia</button><small id="err"></small></div>
<video id="v" playsinline autoplay muted></video><canvas id="c" hidden></canvas>
<div id="hud"><span id="s1">pronto</span><span id="s2"></span><span id="s3"></span></div>
<script>
const W = 960, FPS = 10, Q = 0.72;
let sent = 0, errs = 0, inflight = false, t0 = performance.now();
const v = document.getElementById('v'), c = document.getElementById('c');
async function start() {
  const err = document.getElementById('err');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    err.textContent = 'Camera non disponibile: serve una pagina HTTPS (https://…). Accetta l\'avviso del certificato.'; return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } }, audio: false });
    v.srcObject = stream; await v.play();
    document.getElementById('start').style.display = 'none';
    try { await navigator.wakeLock.request('screen'); } catch (e) {}
    setInterval(tick, 1000 / FPS); setInterval(stats, 1000);
  } catch (e) { err.textContent = 'Errore camera: ' + e.name + ' – ' + e.message; }
}
function tick() {
  if (inflight || !v.videoWidth) return;
  const k = Math.min(1, W / v.videoWidth);
  c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  inflight = true;
  c.toBlob(async (b) => {
    try { const r = await fetch('/frame', { method: 'POST', body: b }); if (r.ok || r.status === 204) sent++; else errs++; }
    catch (e) { errs++; }
    inflight = false;
  }, 'image/jpeg', Q);
}
function stats() {
  const dt = (performance.now() - t0) / 1000;
  document.getElementById('s1').textContent = 'inviati ' + sent;
  document.getElementById('s2').textContent = (sent / dt).toFixed(1) + ' fps';
  document.getElementById('s3').textContent = errs ? ('errori ' + errs) : (v.videoWidth + '×' + v.videoHeight);
}
document.getElementById('go').addEventListener('click', start);
if (location.search.indexOf('auto') >= 0) start();  // prove automatiche
</script></body></html>
